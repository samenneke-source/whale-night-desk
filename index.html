<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WhaleDesk"><meta name="referrer" content="no-referrer"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Whale Night • PAPER</title>
<style>
:root{color-scheme:dark;--g:#2bff88;--gd:#14c964;--r:#ff4d5e;--m:#8a8f98;--card:#111214;--line:#1f2124}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#000;color:#fff;font:15px -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:13px}.badge{background:var(--g);color:#000;font-weight:800;font-size:11px;letter-spacing:.12em;padding:4px 9px;border-radius:20px}.mode{border:1px solid #333;padding:3px 9px;border-radius:20px;font-size:11px;letter-spacing:.08em}
.bal{font-size:56px;font-weight:800;color:var(--g);letter-spacing:-.03em;margin:18px 0 4px;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(43,255,136,.25)}.bal small{font-size:24px;font-weight:700;margin-left:6px}.sub{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.up{color:var(--g)}.dn{color:var(--r)}.flat{color:var(--m)}.pillx{background:rgba(43,255,136,.14);color:var(--g);padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700}
.usd{color:var(--m);font-size:12px;margin-top:4px}.chart{margin:16px -6px 4px;position:relative}.chart svg{width:100%;height:200px;display:block}.cnote{color:var(--m);font-size:11px;text-align:center}
.tabs{display:flex;justify-content:space-between;margin:14px 0 26px}.tabs button{background:none;border:0;color:var(--m);font:700 13px inherit;padding:8px 14px;border-radius:20px;cursor:pointer}.tabs button.on{background:var(--g);color:#000}.tabs button:disabled{opacity:.35}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;margin:0 0 12px}h2 span{font-size:13px;color:var(--g);font-weight:600}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:212px}.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ic{width:34px;height:34px;border-radius:10px;background:#1b1d20;display:grid;place-items:center;font-size:17px}.ch b{display:block}.ch small{color:var(--m);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--g);margin-left:auto;box-shadow:0 0 8px var(--g)}.dot.off{background:#555;box-shadow:none}
.big{font-size:28px;font-weight:800}.lbl{color:var(--m);font-size:12px}.li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}.li .x{color:var(--r);text-decoration:line-through}.li i{color:var(--m);font-style:normal;font-size:12px;text-align:right}
.gauge{display:flex;align-items:center;gap:14px}.gauge svg{width:84px;height:84px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 28px}.dots i{width:6px;height:6px;border-radius:50%;background:#333}.dots i.on{background:var(--g);width:16px;border-radius:4px}
.act{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.act .ic{flex:none}.act div{flex:1;min-width:0}.act b{display:block;font-size:15px}.act small{color:var(--m);font-size:12px}.act .amt{text-align:right;flex:none;font-weight:700;font-size:14px}.act .amt small{display:block;font-weight:400}.empty{color:var(--m);padding:18px 0;text-align:center;font-size:14px}
.acct{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:28px;font-size:13px;color:var(--m);line-height:1.6}.acct b{color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}nav div{display:flex;justify-content:space-around;width:100%;max-width:480px}nav a{color:var(--m);text-decoration:none;font-size:11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}nav a.on{color:var(--g)}nav svg{width:22px;height:22px}
@media(min-width:700px){.card{flex-basis:46%}.bal{font-size:64px}}
.lt{margin:0 0 28px}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);margin-right:7px;box-shadow:0 0 0 0 rgba(43,255,136,.7);animation:pl 1.6s infinite}@keyframes pl{70%{box-shadow:0 0 0 9px rgba(43,255,136,0)}100%{box-shadow:0 0 0 0 rgba(43,255,136,0)}}.cnt{background:#1b1d20;color:#fff;border-radius:10px;padding:1px 8px;font-size:13px;margin-left:6px}
.tr{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.tr.pos{border-color:rgba(43,255,136,.35)}.tr.neg{border-color:rgba(255,77,94,.4)}.trh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.trh b{font-size:18px}.trh small{display:block;color:var(--m);font-size:12px}.pl{text-align:right;font-weight:800;font-size:18px}.pl small{font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}.kv div{background:#0a0a0b;border-radius:12px;padding:8px}.kv span{display:block;color:var(--m);font-size:11px}.kv b{font-size:13px}.why{font-size:13px;color:#cfd3d8;line-height:1.5;border-top:1px solid var(--line);padding-top:10px}.why em{color:var(--g);font-style:normal;font-weight:700}.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wl i{font-style:normal;font-size:11px;background:rgba(43,255,136,.12);color:var(--g);padding:2px 8px;border-radius:10px}
</style></head><body><div class="app">
<section id="home"><div class="top"><span class="badge">PAPER</span><span id="stamp">Connecting…</span><span class="mode" id="mode">—</span></div>
<div class="bal" id="bal">—</div><div class="sub" id="chg"></div><div class="usd" id="usd"></div>
<div class="chart" id="chart"></div><div class="cnote" id="cnote"></div>
<div class="tabs" id="tabs"><button data-r="live" class="on">LIVE</button><button data-r="1">1H</button><button data-r="4">4H</button><button data-r="24">1D</button><button data-r="168">1W</button></div></section>
<section id="trades" class="lt"><h2><span style="color:#fff;font-size:22px;font-weight:700"><i class="pulse"></i>Live trades<i class="cnt" id="tcount">0</i></span><span id="tstamp"></span></h2><div id="tlist"></div></section>
<section id="agents"><h2>Agents <span id="running"></span></h2><div class="cards" id="cards"></div><div class="dots" id="dots"></div></section>
<section id="activity"><h2>Activity <span><a href="#activity" id="seeall" style="color:inherit;text-decoration:none">See all</a></span></h2><div id="feed"></div></section>
<section id="account" class="acct"></section>
</div>
<nav><div><a href="#home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</a><a href="#trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6 4 4 6-8"/></svg>Trades</a><a href="#agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg>Agents</a><a href="#activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a><a href="#account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Account</a></div></nav>
<script>
let D=null,R='live',ALL=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),f=(n,d=3)=>Number(n).toFixed(d),
tm=t=>t?new Date(t).toLocaleTimeString('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'}):'',sg=n=>(n>0?'+':n<0?'−':'')+f(Math.abs(n)),cls=n=>n>0?'up':n<0?'dn':'flat',
mc=n=>n==null?'':n>=1e6?'$'+f(n/1e6,2)+'M':'$'+f(n/1e3,1)+'K',sym=e=>e.symbol||e.ticker||(e.mint?String(e.mint).slice(0,4)+'…'+String(e.mint).slice(-4):'');
async function load(){try{let r=await fetch('dashboard_data.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);D=await r.json();render()}catch(e){$('stamp').textContent='Offline · data may be stale'}}
function render(){const p=D.last_poll||{},age=(Date.now()-Date.parse(D.data_asof))/1000,pnl=D.total_pnl_sol||0,pct=D.start_sol?pnl/D.start_sol*100:0,px=p.sol_usd;
$('stamp').textContent=tm(D.data_asof)+' CET'+(age>240?' · STALE':'');$('mode').textContent=p.mode||'—';
$('bal').innerHTML=f(D.equity_sol,3)+'<small>SOL</small>';
$('chg').innerHTML='<span class="'+cls(pnl)+'">'+(pnl>0?'▲':pnl<0?'▼':'■')+' '+sg(pnl)+' SOL ('+sg(pct).replace(/(\.\d{2})\d/,'$1')+'%)</span><span class="pillx">'+f(D.multiplier,2)+'x</span>';
$('usd').textContent=px?'≈ $'+(D.equity_sol*px).toLocaleString('en-US',{maximumFractionDigits:2})+' at SOL $'+px+' (DexScreener, '+tm(p.market_data_at)+')':'USD hidden: no SOL price in data';
drawChart();renderTrades();renderAgents();renderFeed();
$('account').innerHTML='<b>Paper account</b><br>Start '+f(D.start_sol)+' SOL · cash '+f(D.cash_sol)+' SOL · '+D.open_positions+' open · '+D.wins+'W/'+D.losses+'L<br>Window '+esc(D.limits?.entry_window)+' · max '+esc(D.limits?.max_position_sol)+' SOL/trade · stop −'+esc(D.limits?.stop_pct)+'%<br>Simulated only: no wallet connected, no real funds. Bonding-curve entries blocked (reserve adapter not built). Wallet stats are a 25 Oct research snapshot.<br>Refreshes every 45s.';}

const dash=v=>v==null||v===''||Number.isNaN(v)?'—':v;
function dur(t){if(!t)return'—';let s=(Date.now()-Date.parse(t))/1e3;if(!(s>=0))return'—';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+'m'}
function renderTrades(){const ps=D.positions||[];$('tcount').textContent=ps.length;$('tstamp').textContent=ps.length?'marks '+tm(ps[0].mark_at):'';
if(!ps.length){$('tlist').innerHTML='<div class="tr"><div class="empty" style="padding:10px 0">No open trades, watching '+(D.wallets||[]).length+' wallets</div></div>';return}
$('tlist').innerHTML=ps.map(p=>{const u=p.unrealized_pnl_sol,pc=p.unrealized_pnl_pct??(u!=null&&p.remaining_cost_sol?u/p.remaining_cost_sol*100:null),sz=p.remaining_cost_sol,st=p.stack_pct??(p.initial_cost_sol&&D.start_sol?p.initial_cost_sol/D.start_sol*100:null),stop=p.stop_mc??(p.entry_mc?p.entry_mc*(1-(D.limits?.stop_pct||8)/100):null),c=u==null?'flat':cls(u),wl=p.triggered_by||Object.values(p.buyer_groups||{}).flat();
return '<div class="tr '+(u>0?'pos':u<0?'neg':'')+'"><div class="trh"><div><b>'+esc(p.symbol||'—')+'</b><small>'+esc(p.name||'—')+(p.mark_stale?' · <span class="dn">mark stale</span>':'')+'</small></div><div class="pl '+c+'">'+(u==null?'—':sg(u)+' SOL')+'<small><br>'+(pc==null?'—':sg(pc).replace(/(\.\d{2})\d$/,'$1')+'%')+'</small></div></div>'+
'<div class="kv"><div><span>Entry MC</span><b>'+dash(mc(p.entry_mc))+'</b></div><div><span>Now MC</span><b>'+dash(mc(p.current_mc))+'</b></div><div><span>Stop MC (−8%)</span><b class="dn">'+dash(mc(stop))+'</b></div><div><span>Size</span><b>'+(sz==null?'—':f(sz)+' SOL')+'</b></div><div><span>Of stack</span><b>'+(st==null?'—':f(st,1)+'%')+'</b></div><div><span>In trade</span><b>'+dur(p.opened_at)+'</b></div></div>'+
'<div class="why"><em>Why we’re in:</em> '+esc(p.why||'—')+(wl.length?'<div class="wl">'+wl.map(w=>'<i>🐋 '+esc(w)+'</i>').join('')+'</div>':'')+'</div></div>'}).join('')}
function drawChart(){let pts=(D.equity||[]).map(e=>({t:Date.parse(e.timestamp),y:e.equity_sol}));if(R!=='live'){const c=Date.now()-R*3600e3;pts=pts.filter(e=>e.t>=c)}
if(!pts.length){$('chart').innerHTML='<svg viewBox="0 0 360 200"></svg>';$('cnote').textContent='No equity history in this range';return}
if(pts.length===1)pts=[pts[0],{t:pts[0].t+1,y:pts[0].y}];const ys=pts.map(e=>e.y),lo=Math.min(...ys,D.start_sol)-.01,hi=Math.max(...ys,D.start_sol)+.01,t0=pts[0].t,t1=pts[pts.length-1].t,W=360,H=200;
const c=pts.map(e=>[8+(e.t-t0)/Math.max(1,t1-t0)*(W-60),20+(hi-e.y)/(hi-lo)*(H-40)]);let d='M'+c[0].join(',');for(let i=1;i<c.length;i++){const a=c[i-1],b=c[i],mx=(a[0]+b[0])/2;d+=' C'+mx+','+a[1]+' '+mx+','+b[1]+' '+b.join(',')}
const L=c[c.length-1],ch=pts[pts.length-1].y-pts[0].y,col=ch<0?'#ff4d5e':'#2bff88',by=20+(hi-D.start_sol)/(hi-lo)*(H-40);
$('chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs><line x1="0" x2="'+W+'" y1="'+by+'" y2="'+by+'" stroke="#333" stroke-dasharray="3 5"/><path d="'+d+' L'+L[0]+','+H+' L'+c[0][0]+','+H+'Z" fill="url(#gf)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/><circle cx="'+L[0]+'" cy="'+L[1]+'" r="10" fill="'+col+'" opacity=".5" filter="url(#gl)"/><circle cx="'+L[0]+'" cy="'+L[1]+'" r="5" fill="'+col+'"/><rect x="'+(L[0]-44)+'" y="'+Math.max(2,L[1]-36)+'" width="80" height="22" rx="11" fill="#111" stroke="'+col+'"/><text x="'+L[0]+'" y="'+(Math.max(2,L[1]-36)+15)+'" fill="'+col+'" font-size="12" font-weight="700" text-anchor="middle">'+(ch<0?'−':'+')+f(Math.abs(ch))+' SOL'+'</text></svg>';
$('cnote').textContent=(D.equity||[]).length+' real snapshots · '+(R==='live'?'session':R+'h')+(ch===0?' · flat, no trades closed':'')}
function renderAgents(){const p=D.last_poll||{},ws=D.wallets||[],el=ws.filter(w=>w.eligible),pr=ws.filter(w=>!w.eligible),night=p.mode==='NIGHT',ok=!(p.errors||[]).length;
const blocks=(D.decisions||[]).filter(e=>/REJECT|BLOCK|SKIP|WAIT/.test(e.action||'')).slice(0,4);
const cards=[
['🐋','Whale Watch',p.wallets_polled+'/'+p.wallets_total+' wallets polled',ok,'<div class="big">'+ws.length+'</div><div class="lbl">wallets watched · '+el.length+' qualified · '+pr.length+' probation</div>'+ws.slice(0,3).map(w=>'<div class="li"><span>'+esc(w.label)+'</span><i>'+(w.eligible?'<span class="up">qualified</span>':esc(String(w.status).replace(/^probation: /,'')))+'</i></div>').join('')],
['🧪','Signal Filter',(p.convergence_signals||0)+' signals · '+(p.new_swap_events||0)+' new swaps',ok,blocks.length?blocks.map(e=>'<div class="li"><span class="x">'+esc(sym(e)||e.action)+'</span><i>'+esc(e.reason)+'</i></div>').join(''):'<div class="big">0</div><div class="lbl">rejections or blocks logged yet. Needs 2+ independent wallets within '+esc(D.limits?.convergence_minutes)+' min.</div>'+(ok?'':'<div class="li"><span class="x">poll</span><i>'+esc(p.errors.join(' / '))+'</i></div>')],
['⚡','Executor',(night?'Night window open':'Outside night window'),night,'<div class="gauge"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" stroke="#222" stroke-width="8" fill="none"/><circle cx="42" cy="42" r="34" stroke="#2bff88" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="'+(213.6*Math.min(1,(D.open_positions||0)/3))+' 214" transform="rotate(-90 42 42)"/><text x="42" y="49" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">'+D.open_positions+'</text></svg><div><b>Paper positions</b><div class="lbl">'+f(D.cash_sol)+' SOL cash<br>'+D.closed_trades+' closed</div></div></div><div class="li"><span>Window</span><i>'+esc(D.limits?.entry_window)+'</i></div>']];
$('running').textContent=cards.filter(c=>c[3]).length+' running';
$('cards').innerHTML=cards.map(c=>'<div class="card"><div class="ch"><div class="ic">'+c[0]+'</div><div><b>'+c[1]+'</b><small>'+esc(c[2])+'</small></div><span class="dot'+(c[3]?'':' off')+'"></span></div>'+c[4]+'</div>').join('');
$('dots').innerHTML=cards.map((c,i)=>'<i'+(i?'':' class="on"')+'></i>').join('');}
function renderFeed(){const ev=[];(D.closed||[]).forEach(t=>ev.push({t:t.exit_time||t.closed_at||t.timestamp,ic:'💰',h:'Sold '+esc(sym(t)),s:'Executor',a:t.pnl_sol==null?'':'<span class="'+cls(t.pnl_sol)+'">'+sg(t.pnl_sol)+' SOL</span>',x:esc(t.reason||t.exit_reason||'')}));
(D.positions||[]).forEach(t=>ev.push({t:t.entry_time||t.opened_at||t.timestamp,ic:'🟢',h:'Bought '+esc(sym(t)),s:'Executor',a:t.cost_sol!=null?f(t.cost_sol)+' SOL':(t.remaining_cost_sol!=null?f(t.remaining_cost_sol)+' SOL':''),x:t.entry_mc?'entry '+mc(t.entry_mc):''}));
(D.decisions||[]).forEach(e=>{const A=e.action||'';ev.push({t:e.timestamp,ic:A==='POLL'?'🛰️':/BUY/.test(A)?'🟢':/SELL/.test(A)?'💰':'⛔',h:A==='POLL'?'Poll · '+(e.wallets_polled??'?')+'/'+(e.wallets_total??'?')+' wallets':esc(A[0]+A.slice(1).toLowerCase())+' '+esc(sym(e)),s:A==='POLL'?'Whale Watch':/BUY|SELL/.test(A)?'Executor':'Signal Filter',a:A==='POLL'?(e.convergence_signals||0)+' signals':(e.pnl_sol!=null?'<span class="'+cls(e.pnl_sol)+'">'+sg(e.pnl_sol)+' SOL</span>':''),x:A==='POLL'?(e.new_swap_events||0)+' new swaps':esc(e.reason||'')})});
ev.sort((a,b)=>Date.parse(b.t||0)-Date.parse(a.t||0));const n=ALL?ev.length:6,trades=(D.closed||[]).length+(D.positions||[]).length;
$('feed').innerHTML=(trades?'':'<div class="empty">No trades yet tonight</div>')+ev.slice(0,n).map(e=>'<div class="act"><div class="ic">'+e.ic+'</div><div><b>'+e.h+'</b><small>'+esc(e.s)+' · '+tm(e.t)+'</small></div><div class="amt">'+e.a+'<small>'+e.x+'</small></div></div>').join('');$('seeall').textContent=ALL?'Show less':'See all ('+ev.length+')'}
$('seeall').onclick=e=>{e.preventDefault();ALL=!ALL;if(D)renderFeed()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;R=b.dataset.r==='live'?'live':+b.dataset.r;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));if(D)drawChart()};
$('cards').onscroll=()=>{const c=$('cards'),i=Math.round(c.scrollLeft/(c.firstChild?.offsetWidth+12||1));[...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===i))};
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x===a))});
load();setInterval(load,45000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
